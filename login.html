<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Staff Login | Pag-Asa Healthcare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--green:#0d8f6f;--dark:#10352e;--mint:#e9f8f3;--text:#173b35;--muted:#68827c;--line:#dcebe6}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,Arial,sans-serif;color:var(--text);background:linear-gradient(135deg,#eefaf6,#fff 60%);display:grid;place-items:center;padding:20px}
.login-card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:38px;box-shadow:0 25px 70px rgba(16,53,46,.12)}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:28px}.brand-icon{width:44px;height:44px;border-radius:12px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:800}.brand strong,.brand span{display:block;line-height:1.15}.brand strong{font-size:16px}.brand span{font-size:11px;color:var(--muted)}
.kicker{font-size:10px;font-weight:800;letter-spacing:1.7px;color:var(--green)}h1{font-size:30px;letter-spacing:-1px;color:var(--dark);margin:8px 0}.intro{font-size:12px;color:var(--muted);margin-bottom:25px}
form{display:grid;gap:15px}label{font-size:11px;font-weight:700;color:#45625b}input{display:block;width:100%;margin-top:7px;border:1px solid #d6e7e2;border-radius:9px;padding:12px;font:inherit;font-size:12px;outline:none;background:#fbfefd}input:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--mint)}
.password-wrap{position:relative}.password-wrap input{padding-right:65px}.toggle{position:absolute;right:8px;bottom:6px;background:transparent;color:var(--green);font-size:10px;font-weight:700;padding:6px}
button.login{width:100%;border:0;background:var(--green);color:#fff;padding:13px;border-radius:10px;font:inherit;font-size:12px;font-weight:800;cursor:pointer;margin-top:4px}.error{display:none;background:#fff0f0;color:#b44c4c;border:1px solid #f1d0d0;border-radius:9px;padding:10px;font-size:10px;font-weight:700}.error.show{display:block}.back{display:block;text-align:center;margin-top:20px;color:var(--muted);font-size:11px;font-weight:700;text-decoration:none}.back:hover{color:var(--green)}
.demo{margin-top:22px;padding:12px;border-radius:10px;background:var(--mint);font-size:9px;color:#387267;line-height:1.6}.demo strong{color:var(--dark)}
</style>
</head>
<body>
<main class="login-card">
  <div class="brand"><div class="brand-icon">✚</div><div><strong>Pag-Asa</strong><span>Healthcare Center</span></div></div>
  <span class="kicker">AUTHORIZED PERSONNEL</span>
  <h1>Staff Login</h1>
  <p class="intro">Sign in to access the healthcare center staff dashboard.</p>
  <form id="loginForm">
    <label>Username<input id="username" type="text" autocomplete="username" placeholder="Enter username" required></label>
    <label>Password<div class="password-wrap"><input id="password" type="password" autocomplete="current-password" placeholder="Enter password" required><button class="toggle" type="button" onclick="togglePassword()">Show</button></div></label>
    <div id="error" class="error">Invalid username or password.</div>
    <button class="login" type="submit">Log In →</button>
  </form>
  <div class="demo"><strong>Prototype login</strong><br>Username: <strong>staff</strong><br>Password: <strong>pagasa123</strong></div>
  <a class="back" href="index.html">← Back to Healthcare Website</a>
</main>
<script>
if(sessionStorage.getItem('staffLoggedIn')==='true') location.replace('dashboard.html');
function togglePassword(){const p=document.getElementById('password'),b=document.querySelector('.toggle');p.type=p.type==='password'?'text':'password';b.textContent=p.type==='password'?'Show':'Hide'}
document.getElementById('loginForm').addEventListener('submit',function(e){e.preventDefault();const u=document.getElementById('username').value.trim(),p=document.getElementById('password').value,error=document.getElementById('error');if(u==='staff'&&p==='pagasa123'){sessionStorage.setItem('staffLoggedIn','true');sessionStorage.setItem('staffName','Health Staff');location.replace('dashboard.html')}else{error.classList.add('show')}});
</script>
</body>
</html>
